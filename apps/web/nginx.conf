server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API reverse proxy (same origin → refresh cookie works without CORS)
  location /api/ {
    # brand-asset uploads (videos); keep in step with UPLOAD_MAX_MB in apps/api/.env
    client_max_body_size 220m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Unlisted password sign-in page: keep it out of search engines
  location = /auth/login-up {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
